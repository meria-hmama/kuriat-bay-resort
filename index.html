<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kuriat Bay Resort | Book a room in Skanes, Monastir</title>
    <meta name="description" content="Search rooms, check live prices and book your stay at Kuriat Bay Resort, a fictional beach hotel in Skanes, Monastir. Frontend capstone project with a mocked API." />
    <meta name="theme-color" content="#1c7e75" />
    <meta property="og:title" content="Kuriat Bay Resort booking" />
    <meta property="og:description" content="Boutique hotel booking app built with React, React Query and Zustand." />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      // set the theme before React loads so there's no white flash in dark mode
      try {
        var saved = JSON.parse(localStorage.getItem('kb-theme') || 'null')
        var dark = saved && saved.state ? saved.state.theme === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      } catch (e) {}
    </script>
  </head>
  <body class="bg-sand-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100">
    <noscript>You need JavaScript to use this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
